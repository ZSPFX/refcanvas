name: macOS release build

# Builds the arm64 app bundle only when a release is published (a draft does
# not trigger this), then attaches it to that same release. Commits, tags and
# draft releases never start a build.
on:
  release:
    types: [published]
  # Manual retry for a failed build; a tag is required so it cannot run blind.
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag (for example v0.1.4)
        required: true

permissions:
  contents: write

jobs:
  macos-arm64:
    runs-on: macos-14
    steps:
      - name: Resolve the release tag
        id: tag
        env:
          EVENT_TAG: ${{ github.event.release.tag_name }}
          INPUT_TAG: ${{ inputs.tag }}
        run: |
          TAG="${EVENT_TAG:-$INPUT_TAG}"
          if [ -z "$TAG" ]; then
            echo "ERROR: no release tag (pass one for manual runs)." >&2
            exit 1
          fi
          echo "tag=$TAG" >>"$GITHUB_OUTPUT"

      - uses: actions/checkout@v4
        with:
          ref: ${{ steps.tag.outputs.tag }}

      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-apple-darwin

      # `shared-key` + `key` lets the restore fall back to the newest cache for
      # this workflow instead of demanding an exact match. Cargo then rebuilds
      # only the crates whose sources actually changed.
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: macos-release
          key: arm64
          # The build dir must match CARGO_TARGET_DIR below, or the restore
          # lands somewhere the script never looks.
          workspaces: ". -> target"
          # A packaging failure after a successful compile must not throw the
          # compilation away.
          cache-on-failure: true

      - name: Build the app bundle
        env:
          # Pinned so `cargo metadata`'s target_directory equals the cached one.
          CARGO_TARGET_DIR: ${{ github.workspace }}/target
          REF_RELEASE_TAG: ${{ steps.tag.outputs.tag }}
        run: ./scripts/build-macos.sh

      - name: Build statistics
        run: |
          du -sh target 2>/dev/null || true
          echo "cached rlibs: $(ls target/aarch64-apple-darwin/release/deps 2>/dev/null | wc -l)"

      - name: Attach the artifact to the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ steps.tag.outputs.tag }}
        run: gh release upload "$TAG" dist/refcanvas-*-macos-arm64.zip --clobber
